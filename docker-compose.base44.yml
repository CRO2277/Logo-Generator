services:
  web:
    image: node:22-alpine
    container_name: logoforge-web
    working_dir: /app
    restart: unless-stopped
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ./.env.base44-defaults
      - path: /run/base44/app.env
        required: false
    ports:
      - "3000:3000"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3000 --strictPort"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  node_modules:
